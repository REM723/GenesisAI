[project]
name = "genesisai-memory"
version = "0.1.0"
description = "GenesisAI per-project context memory (SRS §2)"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.8",
    "chromadb>=0.5",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["genesis_memory"]
