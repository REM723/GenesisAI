[project]
name = "genesisai-router"
version = "0.1.0"
description = "GenesisAI LLM routing and provider adapters (SRS §4)"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.8",
    "langchain-core>=0.3",
    "langchain-openai>=0.2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["genesis_router"]
