# Root Python tooling config (ruff + mypy + pytest) spanning apps/api and packages/*.
# Runtime deps live in apps/api/pyproject.toml; dev tooling in requirements-dev.txt.
[tool.ruff]
line-length = 100
target-version = "py311"
src = ["apps/api", "packages"]
extend-exclude = ["packages/shared"]  # TypeScript package

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "N", "ASYNC", "S", "C4", "SIM"]

[tool.ruff.lint.per-file-ignores]
"**/tests/**" = ["S"]  # assert-based tests

[tool.ruff.lint.flake8-bugbear]
# FastAPI dependency-injection markers are meant to be called in argument defaults.
extend-immutable-calls = ["fastapi.Depends", "fastapi.Query", "fastapi.Path", "fastapi.Body", "fastapi.Header", "fastapi.Cookie", "fastapi.Form"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["apps/api/app", "packages"]
exclude = ["packages/shared", "tests/"]
plugins = ["pydantic.mypy"]

[tool.pytest.ini_options]
testpaths = ["apps/api/tests", "packages/router/tests", "tests"]
asyncio_mode = "auto"
